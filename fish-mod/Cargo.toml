[package]
name = "fish-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# How to Fish mod. Unity Mono game by Dazed Games (AppID 4001890).
# Rust cdylib loaded by cs-shim-mono (BepInEx 5) through unityforge.
# Uses FishNet for networking and Heathen Steamworks.

[lib]
crate-type = ["cdylib"]
name = "fish_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "fish_mod.unityforge.dll"
