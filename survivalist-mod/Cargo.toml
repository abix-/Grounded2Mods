[package]
name = "survivalist-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Survivalist: Invisible Strain mod. Rust cdylib loaded into the
# game by Unityforge.Shim.Survivalist through the game's OFFICIAL
# mod loader (Story.LoadDLLs -> Main.Load), not BepInEx. v1 scope
# is the HTTP control plane for live research (SV5 in
# docs/todo.md).

[lib]
crate-type = ["cdylib"]
name = "survivalist_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }

# Deploy convention: the shim looks for `*.unityforge.dll` in the
# MOD FOLDER (one level above DLLs/, so the game's loader doesn't
# Assembly.LoadFrom a native image). After building, copy the
# cdylib there as `survivalist_mod.unityforge.dll`.

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "survivalist_mod.unityforge.dll"
