[package]
name = "ueforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Base layer for every UE4SS Rust mod in this workspace.
# One crate, no feature flags. ueforge's own build.rs compiles the
# bundled C++ (imgui + ueforge_ui + ueforge_shim) into a static lib
# that cargo links into every consumer (cdylib, test binary, the
# game's build script binary). Same dep entry, three contexts.

[lib]
crate-type = ["rlib"]

# Offline UE-asset inspection CLIs. Thin wrappers over
# `ueforge::uasset`. Used for diffing third-party pak mods,
# reverse-engineering data tables, sanity-checking that a mod
# actually touches the field its description claims.
[[bin]]
name = "dump-strings"
path = "src/bin/dump_strings.rs"

[[bin]]
name = "read-property"
path = "src/bin/read_property.rs"

# `ueforge-deploy` lifted to `modforge-deploy` during Phase 0b
# row 18. The bin now lives at
# `modforge/src/bin/modforge_deploy.rs`; the `cargo deploy ...`
# alias was repointed at the new name.

[dependencies]
modforge = { path = "../modforge" }
# Same version modforge pins: `ue::pieces` reads levels straight
# into `modforge::structure::PieceDef`, whose vectors are glam's.
glam = "0.33"
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true }
# `cc` is also a regular dep so `ueforge::build::CppShim` (called
# from a downstream mod's build.rs) can drive cc::Build directly.
# cc is mostly compile-time logic; the cdylib's release linker
# strips its runtime functions as dead code.
cc = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
widestring = { workspace = true }
memoffset = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
hex = { workspace = true }
crossbeam-channel = { workspace = true }
region = { workspace = true }
smallvec = { workspace = true }
fastrand = { workspace = true }
patternsleuth = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }

[lints]
workspace = true

[build-dependencies]
cc = { workspace = true }
