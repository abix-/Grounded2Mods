[package]
name = "outworld-station-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Outworld Station multi-feature mod. First feature: item stack
# adjustments (the "Better Item Stacks" pattern, but as a runtime
# mod via ueforge instead of a static _P pak). Future features
# layer on the same scaffold: hunger / thirst / inventory /
# movement tweaks, all driven through DataTable mutations and CDO
# writes.

[lib]
# Built as `outworld_station_mod.dll`, DEPLOYED as
# OutworldStation\Binaries\Win64\ue4ss\Mods\OutworldStationMod\dlls\main.dll.
# The build artifact must not be called `main`: several mods in
# this workspace build cdylibs, and a shared output name lets them
# overwrite each other in target, after which cargo treats the
# loser as fresh and never rewrites it. See misery-mod/Cargo.toml.
name = "outworld_station_mod"
crate-type = ["cdylib", "rlib"]

# Consumed by ueforge's ueforge-deploy bin.
[package.metadata.ueforge]
mod_folder_name = "OutworldStationMod"
game_name_regex = "Outworld"
game_sub_path   = "OutworldStation/Binaries/Win64"
zip_prefix      = "outworld-station-mod"
target_dir      = "target/outworld-station-mod"

[features]
# Spawn a console window inside the game process for live log
# output. Off by default for shipping; the file log at
# <DLL_dir>/outworld_station_mod.log is the durable record.
console = []
default = ["console"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ueforge = { path = "../ueforge" }

[build-dependencies]
ueforge = { path = "../ueforge" }

[dev-dependencies]
ueforge = { path = "../ueforge" }

[lints]
workspace = true
