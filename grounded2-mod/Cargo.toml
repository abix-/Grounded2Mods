[package]
name = "grounded2-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Built as `grounded2_mod.dll`, DEPLOYED as `main.dll` (UE4SS
# requires that filename in the dlls folder). The build artifact
# must not be called `main`: several mods in this workspace build
# cdylibs, and a shared output name lets them overwrite each other
# in target, after which cargo treats the loser as fresh and never
# rewrites it. See misery-mod/Cargo.toml.
name = "grounded2_mod"
crate-type = ["cdylib", "rlib"]

# Consumed by ueforge/scripts/deploy.ps1.
[package.metadata.ueforge]
mod_folder_name  = "Grounded2Mod"
game_name_regex  = "Grounded"
game_sub_path    = "Augusta/Binaries/WinGRTS"
zip_prefix       = "grounded2-mod"
target_dir       = "target/grounded2-mod"
example_settings = "grounded2-mod/settings.example.json"

[features]
console = []
default = ["console"]

[dependencies]
anyhow = { workspace = true }
widestring = { workspace = true }
memoffset = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ueforge = { path = "../ueforge" }
modforge = { path = "../modforge" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
] }

[build-dependencies]
ueforge = { path = "../ueforge" }

[dev-dependencies]
ueforge = { path = "../ueforge" }
hex = { workspace = true }
zerocopy = { workspace = true }

[lints]
workspace = true
